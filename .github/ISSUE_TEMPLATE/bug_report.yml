name: Bug report
description: A wrong number, a crash, or a check that fires when it should not
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A small reproduction is worth more than a long description.
        Please do **not** attach market data, broker exports or credentials.
  - type: input
    id: version
    attributes:
      label: quant-falsifier version
      description: Output of `quant-falsifier --version` or `python -c "import quant_falsifier; print(quant_falsifier.__version__)"`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, NumPy version and operating system.
      placeholder: "Python 3.12.4, NumPy 2.1.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A self-contained snippet. Synthetic data only — build inputs with `numpy.random.default_rng(seed)`.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened, and why (equation, paper or test name if relevant).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: The exact output or traceback.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no real market data, credentials or licensed content.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
