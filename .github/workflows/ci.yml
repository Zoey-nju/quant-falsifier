name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=quant_falsifier --cov-report=term-missing --cov-report=xml

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lh dist

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install dist/*.whl
          /tmp/venv/bin/python -c "import quant_falsifier as q; print(q.__version__)"
          cd /tmp && /tmp/venv/bin/quant-falsifier demo --out /tmp/demo_out
          test -f /tmp/demo_out/report.html
          /tmp/venv/bin/quant-falsifier ledger verify /tmp/demo_out/trials.jsonl
