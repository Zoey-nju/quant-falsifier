<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Naive K-fold versus purged K-fold with embargo">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 12px; }
    .small { font-size: 11px; fill: #59636e; }
    .train { fill: #dbeafe; stroke: #2563eb; }
    .test { fill: #fde68a; stroke: #b45309; }
    .leak { fill: #fecaca; stroke: #b91c1c; }
    .embargo { fill: #e5e7eb; stroke: #6b7280; stroke-dasharray: 4 3; }
  </style>

  <text x="20" y="26" class="title">Naive K-fold: overlapping labels leak test information</text>
  <text x="20" y="48" class="small">Each observation carries a 5-bar label window, drawn as the thin bar underneath.</text>

  <g>
    <rect x="20" y="62" width="700" height="34" class="train"/>
    <rect x="320" y="62" width="100" height="34" class="test"/>
    <rect x="290" y="104" width="160" height="12" class="leak"/>
    <rect x="20" y="62" width="290" height="34" class="leak" opacity="0.35"/>
    <text x="30" y="84" class="label">train</text>
    <text x="352" y="84" class="label">test</text>
    <text x="300" y="132" class="small">training labels overlapping the test window</text>
  </g>

  <text x="20" y="180" class="title">Purged K-fold with embargo</text>
  <text x="20" y="202" class="small">Training samples whose labels touch the test window are dropped; the embargo removes the rest.</text>

  <g>
    <rect x="20" y="216" width="290" height="34" class="train"/>
    <rect x="310" y="216" width="12" height="34" class="embargo"/>
    <rect x="322" y="216" width="90" height="34" class="test"/>
    <rect x="412" y="216" width="12" height="34" class="embargo"/>
    <rect x="424" y="216" width="296" height="34" class="train"/>
    <rect x="290" y="258" width="152" height="12" class="train" opacity="0.35"/>
    <text x="30" y="238" class="label">train</text>
    <text x="316" y="238" class="small">purge</text>
    <text x="352" y="238" class="label">test</text>
    <text x="432" y="238" class="label">train</text>
    <text x="290" y="288" class="small">test label window fully inside the test block</text>
  </g>
</svg>
